<head>

<style>
:root{
  --g:#2d5a3d;--gd:#1e3d29;--gl:#e8f2eb;--gm:#4a8c61;
  --red:#c0392b;--redl:#fdf0f0;
  --blue:#185fa5;--bluel:#edf4fc;
  --border:#d4cfc4;--borderl:#e8e3da;
  --bg:#f2efe9;--card:#fff;--surface:#faf9f6;
  --text:#1a1814;--muted:#6b6558;--hint:#9e9589;
  --r:12px;--rs:8px;
  --mono:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:16px;overscroll-behavior:none;}

/* HEADER */
.hdr{background:var(--g);color:#fff;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;position:sticky;top:0;z-index:200;}
.hdr h1{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:#6fcf97;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.badge{font-size:10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);padding:2px 9px;border-radius:20px;letter-spacing:.06em;}

/* LOGIN */
#s-login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100svh - 50px);padding:1.5rem;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2rem 1.5rem;max-width:340px;width:100%;text-align:center;}
.login-box h2{font-size:19px;font-weight:500;margin-bottom:8px;}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.btn-ms{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;background:#0078d4;color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:500;cursor:pointer;touch-action:manipulation;}
.btn-ms:active{opacity:.85;}

/* APP */
#app{display:none;}
.screen{display:none;}
.screen.on{display:block;}

/* USER BAR */
.ubar{background:var(--card);border-bottom:1px solid var(--borderl);padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between;}
.uinfo{display:flex;align-items:center;gap:8px;}
.av{width:28px;height:28px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--g);}
.uname{font-size:13px;font-weight:500;}
.btn-out{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);padding:4px 10px;border-radius:20px;cursor:pointer;touch-action:manipulation;}

/* CAMPOS */
.wrap{padding:1rem;}
.field{margin-bottom:.9rem;}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase;}
input[type=text],input[type=date],input[type=number]{
  width:100%;height:52px;border:1.5px solid var(--border);border-radius:var(--rs);
  padding:0 14px;font-size:17px;color:var(--text);background:var(--surface);
  -webkit-appearance:none;appearance:none;transition:border-color .15s;
}
input:focus{outline:none;border-color:var(--gm);background:#fff;box-shadow:0 0 0 3px rgba(74,140,97,.12);}

/* GRANJA DROPDOWN */
.gd-wrap{position:relative;}
.gdrop{display:none;position:absolute;z-index:400;width:100%;background:#fff;border:1.5px solid var(--gm);border-top:none;border-radius:0 0 var(--rs) var(--rs);max-height:260px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.15);}
.gopt{padding:13px 14px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--borderl);display:flex;align-items:center;gap:8px;touch-action:manipulation;}
.gopt .gid{font-family:var(--mono);font-size:11px;color:var(--hint);min-width:22px;}
.gopt:active{background:var(--gl);}
.gopt.nr{color:var(--hint);pointer-events:none;}

/* SESIÓN HEADER */
.sess-hdr{background:var(--g);color:#fff;border-radius:var(--r);padding:1.1rem 1rem;margin-bottom:1rem;}
.sess-hdr h2{font-size:17px;font-weight:500;margin-bottom:3px;}
.sess-hdr p{font-size:12px;opacity:.75;}
.btn-primary{width:100%;height:54px;background:var(--g);color:#fff;border:none;border-radius:var(--rs);font-size:16px;font-weight:500;cursor:pointer;touch-action:manipulation;}
.btn-primary:active{background:var(--gd);}

/* CAPTURA — contador */
.cap-info{background:var(--card);border-bottom:1px solid var(--borderl);padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.cap-pills{display:flex;gap:5px;flex-wrap:wrap;}
.pill{background:var(--gl);color:var(--g);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;}
.cap-num{text-align:right;flex-shrink:0;}
.cap-num-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--g);line-height:1;}
.cap-num-lbl{font-size:10px;color:var(--hint);}
.cap-sub{padding:.3rem 1rem .1rem;display:flex;align-items:center;justify-content:space-between;}
.cap-count{font-size:12px;color:var(--hint);font-family:var(--mono);}
.btn-sm{font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);padding:3px 9px;border-radius:20px;cursor:pointer;touch-action:manipulation;}

/* LÓBULOS */
.lob-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:.75rem 1rem 0;overflow:hidden;}
.lob-card:last-of-type{margin-bottom:.75rem;}
.lob-sec-hdr{padding:.55rem 1rem;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--borderl);}
.lob-sec-hdr.der{background:var(--bluel);color:var(--blue);}
.lob-sec-hdr.izq{background:var(--gl);color:var(--g);}
.lob-sec-hdr.acc{background:#f0eaff;color:#5c3a8a;}

.lob-row{display:flex;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--borderl);gap:12px;}
.lob-row:last-child{border-bottom:none;}
.lob-info{flex:1;min-width:0;}
.lob-nombre{font-size:15px;font-weight:500;}
.lob-peso-txt{font-size:11px;color:var(--hint);font-family:var(--mono);}

/* Input lóbulo — teclado numérico */
.lob-num-wrap{display:flex;align-items:center;gap:6px;}
.lob-num{
  width:76px;height:52px;
  border:2px solid var(--border);border-radius:var(--rs);
  font-size:22px;font-weight:700;font-family:var(--mono);
  text-align:center;color:var(--text);background:var(--surface);
  -webkit-appearance:none;appearance:none;padding:0;
  transition:border-color .15s,background .15s;
}
.lob-num:focus{outline:none;border-color:var(--gm);background:#fff;}
.lob-num.has-val{border-color:var(--gm);background:var(--gl);color:var(--g);}
.lob-unit{font-size:14px;color:var(--hint);font-weight:500;}

/* HALLAZGOS */
.hall-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 1rem .75rem;overflow:hidden;}
.hall-hdr{padding:.55rem 1rem;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--borderl);color:var(--muted);}
.hall-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--borderl);}
.hall-item{background:var(--card);padding:.7rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hall-lbl{font-size:13px;color:var(--text);flex:1;line-height:1.3;}
.tg{display:flex;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0;}
.tg button{width:40px;height:38px;border:none;background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;transition:background .1s,color .1s;color:var(--muted);}
.tg button:first-child{border-right:1px solid var(--border);}
.tg button.no-on{background:var(--gl);color:var(--g);}
.tg button.si-on{background:var(--redl);color:var(--red);}

/* BARRA INFERIOR FIJA */
.btm{
  position:sticky;bottom:0;
  background:var(--card);border-top:1.5px solid var(--border);
  padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
  display:flex;gap:8px;z-index:100;
}
.btn-skip{
  flex:0 0 100px;height:56px;
  border:1.5px solid var(--border);border-radius:var(--rs);
  background:#fff;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;touch-action:manipulation;line-height:1.3;
}
.btn-skip:active{background:var(--surface);}
.btn-next{
  flex:1;height:56px;border:none;border-radius:var(--rs);
  background:var(--g);color:#fff;font-size:17px;font-weight:600;
  cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-next:active{background:var(--gd);}
.btn-next:disabled{background:var(--border);cursor:not-allowed;}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.spacer{height:100px;}

/* TOAST */
.toast{
  position:fixed;bottom:5.5rem;left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--text);color:#fff;
  padding:10px 20px;border-radius:var(--rs);
  font-size:13px;font-weight:500;opacity:0;
  transition:all .2s;z-index:999;pointer-events:none;
  white-space:nowrap;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--g);}
.toast.err{background:var(--red);}

/* CFG WARNING */
.cfg{background:#fdf5e8;border:1px solid #c09050;border-radius:var(--rs);padding:.75rem 1rem;font-size:12px;color:#7a4f10;margin:.75rem;line-height:1.6;display:none;}
.cfg code{background:rgba(0,0,0,.07);padding:1px 4px;border-radius:3px;font-family:var(--mono);}
</style>
</head>

<script>
let msalApp,spSiteId='',spListId='';

async function doLogin(){
  try{

    msalApp=new msal.PublicClientApplication({
      auth:{
        clientId:CONFIG.CLIENT_ID,
        authority:`https://login.microsoftonline.com/${CONFIG.TENANT_ID}`,
        redirectUri:location.origin+location.pathname
      },
      cache:{cacheLocation:'sessionStorage'}
    });
    await msalApp.initialize();
    const r=await msalApp.loginPopup({scopes:['User.Read','Sites.ReadWrite.All']});
    showApp(r.account);
  }catch(e){showToast('Error: '+e.message,'err');}
}

async function getToken(){
  if(!msalApp)return null;
  try{
    const r=await msalApp.acquireTokenSilent({
      scopes:['Sites.ReadWrite.All'],
      account:msalApp.getAllAccounts()[0]
    });
    return r.accessToken;
  }catch{
    const r=await msalApp.acquireTokenPopup({scopes:['Sites.ReadWrite.All']});
    return r.accessToken;
  }
}

function doLogout(){
  if(msalApp)msalApp.logout();
  else{
    document.getElementById('s-login').style.display='flex';
    document.getElementById('app').style.display='none';
  }
}

function showApp(acc){
  document.getElementById('s-login').style.display='none';
  document.getElementById('app').style.display='block';
  const name=acc.displayName||acc.name||'Usuario';
  document.getElementById('uname').textContent=name;
  document.getElementById('av').textContent=name.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
  document.getElementById('s_fecha').value=new Date().toISOString().split('T')[0];

}

async function resolverSP(){
  if(spSiteId&&spListId)return;
  const tok=await getToken();
  if(!tok)return;
  const u=new URL(CONFIG.SP_SITE_URL);
  const sr=await fetch(
    `https://graph.microsoft.com/v1.0/sites/${u.hostname}:${u.pathname}`,
    {headers:{Authorization:`Bearer ${tok}`}}
  );
  if(!sr.ok)throw new Error('Sitio SharePoint no encontrado.');
  const s=await sr.json();
  spSiteId=s.id;
  const lr=await fetch(
    `https://graph.microsoft.com/v1.0/sites/${spSiteId}/lists?$filter=displayName eq '${CONFIG.LIST_NAME}'`,
    {headers:{Authorization:`Bearer ${tok}`}}
  );
  const ld=await lr.json();
  if(!ld.value?.length)throw new Error(`Lista "${CONFIG.LIST_NAME}" no encontrada.`);
  spListId=ld.value[0].id;
}

async function guardarSP(fields){
  const tok=await getToken();
  if(!tok) throw new Error('No se pudo obtener token. Inicie sesión nuevamente.');
  await resolverSP();
  const r=await fetch(
    `https://graph.microsoft.com/v1.0/sites/${spSiteId}/lists/${spListId}/items`,
    {
      method:'POST',
      headers:{Authorization:`Bearer ${tok}`,'Content-Type':'application/json'},
      body:JSON.stringify({fields})
    }
  );
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Error al guardar');}
  return await r.json();
}
</script>

<!-- ══ GRANJA DROPDOWN ══ -->
<script>
function filtrarG(q){
  const t=q.trim().toUpperCase();
  renderG(t
    ? GRANJAS.filter(g=>g.n.toUpperCase().includes(t)||String(g.id).startsWith(t))
    : GRANJAS
  );
  document.getElementById('s_gdrop').style.display='block';
}
function abrirG(){filtrarG(document.getElementById('s_gsearch').value);}
function renderG(lista){
  const d=document.getElementById('s_gdrop');
  d.innerHTML=lista.length
    ? lista.map(g=>`<div class="gopt" onclick="selG(${g.id},'${g.n.replace(/'/g,"\\'")}')">
        <span class="gid">${g.id}</span>${g.n}
      </div>`).join('')
    : '<div class="gopt nr">Sin resultados</div>';
}
function selG(id,n){
  document.getElementById('s_gid').value=id;
  document.getElementById('s_gnombre').value=n;
  document.getElementById('s_gsearch').value=n;
  document.getElementById('s_gdrop').style.display='none';
}
document.addEventListener('click',e=>{
  const s=document.getElementById('s_gsearch');
  const d=document.getElementById('s_gdrop');
  if(s&&d&&!s.contains(e.target)&&!d.contains(e.target))
    d.style.display='none';
});
</script>

<!-- ══ BUILDER DE CAMPOS ══ -->
<script>
function buildLobulos(){
  ['der','izq','acc'].forEach(g=>{
    const cont=document.getElementById('lrows-'+g);
    cont.innerHTML='';
    LOBULOS.filter(l=>l.g===g).forEach(lob=>{
      lobVals[lob.id]=null;
      const div=document.createElement('div');
      div.className='lob-row';
      div.innerHTML=`
        <div class="lob-info">
          <div class="lob-nombre">${lob.label}</div>
          <div class="lob-peso-txt">peso ×${Math.round(lob.peso*100)}%</div>
        </div>
        <div class="lob-num-wrap">
          <input
            class="lob-num"
            id="li-${lob.id}"
            type="number"
            min="0" max="100" step="1"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="—"
            oninput="onLob('${lob.id}',this)"
            onfocus="this.select()"
          >
          <span class="lob-unit">%</span>
        </div>`;
      cont.appendChild(div);
    });
  });
}

function onLob(id,el){
  let v=parseInt(el.value);
  if(isNaN(v)||v<0){v=0;el.value=0;}
  if(v>100){v=100;el.value=100;}
  lobVals[id]=v;
  el.classList.toggle('has-val',v>0);
}

function buildHallazgos(){
  const g=document.getElementById('hgrid');
  g.innerHTML='';
  HALLAZGOS.forEach(h=>{
    hallVals[h.id]=0;
    const d=document.createElement('div');
    d.className='hall-item';
    d.innerHTML=`
      <span class="hall-lbl">${h.label}</span>
      <div class="tg">
        <button class="no-on" id="no-${h.id}" onclick="setH('${h.id}',0)">No</button>
        <button id="si-${h.id}" onclick="setH('${h.id}',1)">Sí</button>
      </div>`;
    g.appendChild(d);
  });
}

function setH(id,v){
  hallVals[id]=v;
  document.getElementById('no-'+id).className=v===0?'no-on':'';
  document.getElementById('si-'+id).className=v===1?'si-on':'';
}
</script>

<!-- ══ FLUJO ══ -->
<script>
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo({top:0,behavior:'instant'});
}

function irSesion(){showScreen('s-sesion');}

function iniciarSesion(){
  const fecha=document.getElementById('s_fecha').value;
  const gId=document.getElementById('s_gid').value;
  const gN=document.getElementById('s_gnombre').value;
  const consec=document.getElementById('s_consec').value.trim();
  const inicio=parseInt(document.getElementById('s_inicio').value)||1;

  if(!fecha){showToast('Ingrese la fecha','err');return;}
  if(!gId){showToast('Seleccione una granja','err');return;}
  if(!consec){showToast('Ingrese el consecutivo','err');return;}

  sesion={fecha,gId:parseInt(gId),gN,consec,orden:inicio};
  registrados=0;

  document.getElementById('c-granja').textContent=gN;
  document.getElementById('c-consec').textContent='#'+consec;
  document.getElementById('c-fecha').textContent=fecha;

  resetAnimal();
  showScreen('s-captura');
}

function resetAnimal(){
  // Limpiar lóbulos
  LOBULOS.forEach(l=>{
    lobVals[l.id]=null;
    const el=document.getElementById('li-'+l.id);
    if(el){el.value='';el.classList.remove('has-val');}
  });
  // Limpiar hallazgos
  HALLAZGOS.forEach(h=>{
    hallVals[h.id]=0;
    const no=document.getElementById('no-'+h.id);
    const si=document.getElementById('si-'+h.id);
    if(no)no.className='no-on';
    if(si)si.className='';
  });
  // Actualizar UI de orden y contador
  document.getElementById('c-orden').textContent=sesion.orden;
  document.getElementById('c-count').textContent=registrados+' registrado'+(registrados===1?'':'s');
}

async function guardarYSiguiente(){
  const btn=document.getElementById('btn-next');
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span>';

  // Calcular índice Madec e indicadores (no se muestran, solo se guardan)
  const idn=LOBULOS.reduce((s,l)=>s+(lobVals[l.id]||0)/100*l.peso,0);
  const consol=idn*100;
  let categ=0;
  if(consol>0&&consol<=10)categ=1;
  else if(consol<=20)categ=2;
  else if(consol<=30)categ=3;
  else if(consol<=40)categ=4;
  else if(consol<=50)categ=5;
  else if(consol>50) categ=6;
  const gdpGr=interpGDP(consol);
  const gdpKg=(gdpGr*CONFIG.DIAS_CEBA)/1000;
  let sev='Sin afectacion';
  if(idn>.10&&idn<=.25)sev='Leve';
  else if(idn<=.50)sev='Moderada';
  else if(idn>.50)sev='Severa';
  const pleurT=(hallVals.pleuritis_leve===1||hallVals.pleuritis_severa===1)?1:0;

  const fields={
    Title:`${sesion.gN}-${sesion.consec}-${sesion.orden}`,
    fecha_inspeccion: sesion.fecha,
    granja_id:        sesion.gId,
    granja_nombre:    sesion.gN,
    consecutivo:      sesion.consec,
    orden:            sesion.orden,
    // Lóbulos (0–100)
    apical_derecho:          lobVals.apical_derecho         ||0,
    cardiaco_derecho:        lobVals.cardiaco_derecho        ||0,
    diafragmatico_derecho:   lobVals.diafragmatico_derecho   ||0,
    apical_izquierdo:        lobVals.apical_izquierdo        ||0,
    cardiaco_izquierdo:      lobVals.cardiaco_izquierdo      ||0,
    diafragmatico_izquierdo: lobVals.diafragmatico_izquierdo ||0,
    accesorio:               lobVals.accesorio               ||0,
    // Hallazgos (true/false para SharePoint)
    cicatriz_en_pulmones:    hallVals.cicatriz_en_pulmones===1,
    pleuritis_leve:          hallVals.pleuritis_leve===1,
    pleuritis_severa:        hallVals.pleuritis_severa===1,
    neumonia_intersticial:   hallVals.neumonia_intersticial===1,
    absceso_pulmon:          hallVals.absceso_pulmon===1,
    nodulo_pulmon:           hallVals.nodulo_pulmon===1,
    pericarditis:            hallVals.pericarditis===1,
    manchas_leche:           hallVals.manchas_leche===1,
    artefacto_agua:          hallVals.artefacto_agua===1,
    artefacto_sangre:        hallVals.artefacto_sangre===1,
    petequias:               hallVals.petequias===1,
    // Calculados (guardados pero no mostrados)
    indice_madec:        parseFloat(idn.toFixed(4)),
    consolidacion_total: parseFloat(consol.toFixed(2)),
    categoria:           categ,
    cc_mycoplasma:       categ,
    severidad:           sev,
    pleuritis_total:     pleurT===1,
    perdida_gdp_gr:      parseFloat(gdpGr.toFixed(2)),
    perdida_gdp_kg:      parseFloat(gdpKg.toFixed(4)),
    registrado_por:      document.getElementById('uname').textContent,
    fecha_registro:      new Date().toISOString()
  };

  try{
    await guardarSP(fields);
    registrados++;
    sesion.orden++;
    resetAnimal();
    showToast('✓ Guardado — animal #'+(sesion.orden-1),'ok');
  }catch(e){
    showToast('Error: '+e.message,'err');
  }finally{
    btn.disabled=false;
    btn.innerHTML='Guardar y siguiente →';
  }
}

function saltarAnimal(){
  // Registra el animal sin marcar nada (todos en 0)
  LOBULOS.forEach(l=>{lobVals[l.id]=0;});
  HALLAZGOS.forEach(h=>{hallVals[h.id]=0;});
  guardarYSiguiente();
}

function showToast(msg,tipo){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast on '+(tipo||'ok');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.className='toast',2200);
}

window.addEventListener('DOMContentLoaded',()=>{
  buildLobulos();
  buildHallazgos();

});
</script>
